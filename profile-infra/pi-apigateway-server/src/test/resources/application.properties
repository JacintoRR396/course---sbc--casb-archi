### MS Gateway Server
spring.application.name=ms-pi-apigateway-server-test
spring.profiles.active=native
spring.devtools.restart.enabled=false

### Config Server
spring.cloud.config.enabled=false

### MS Eureka Server
eureka.client.enabled=false
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false
# Network
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.cloud.inetutils.preferred-networks=127.0.0
spring.cloud.inetutils.ignored-interfaces=docker0,veth.*,VMware.*,VirtualBox.*,eth0,wlan0

### Logging
# Networks
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR
# Cache Caffeine
logging.level.org.springframework.cloud.loadbalancer=ERROR