### Config MS
spring.application.name=ms-pi-admin-server
server.port=9001
spring.thymeleaf.check-template-location=false

### Eureka Server
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
# Network
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.cloud.inetutils.preferred-networks=127.0.0
spring.cloud.inetutils.ignored-interfaces=docker0,veth.*,VMware.*,VirtualBox.*,eth0,wlan0
# Management and Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=ALWAYS
management.info.env.enabled=true

### Logging
# Networks
logging.level.org.springframework.cloud.commons.util.InetUtils=ERROR
# Cache Caffeine
logging.level.org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration$LoadBalancerCaffeineWarnLogger=ERROR
# Empty replicas (only dev when single-node)
logging.level.com.netflix.eureka.cluster.PeerEurekaNodes=ERROR
logging.level.com.netflix.eureka.registry.AbstractInstanceRegistry=ERROR
logging.level.com.netflix.discovery=ERROR
logging.level.com.netflix.discovery.InstanceInfoReplicator=OFF
# Status
logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=OFF
logging.level.de.codecentric.boot.admin.server.services.StatusUpdater=OFF
logging.level.reactor.netty.http.client.HttpClient=OFF

### Custom Properties
custom.schema=http://localhost:${server.port}