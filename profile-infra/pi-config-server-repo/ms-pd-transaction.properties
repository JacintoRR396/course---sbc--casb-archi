### Config MS Rest
spring.application.name=ms-pd-transaction
server.port=8083
server.servlet.context-path=/rest/v1
server.tomcat.threads.max=2
custom.profile.active=default

### JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
spring.jpa.defer-datasource-initialization=true
# Data Base : H2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:transaciton;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL;
spring.datasource.username=sa
spring.datasource.password=qwerty
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

### Tools
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.packagesToScan=com.ssdjr2.pd.transaction.controller, com.ssdjr2.pd.transaction.domain.dto
springdoc.pathsToMatch=/rest/v1, /transactions/**
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

### Eureka Server
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
# Management and Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=ALWAYS

### Custom Properties
custom.schema=http://localhost:${server.port}/${server.servlet.context-path}